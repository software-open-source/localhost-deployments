  

services:  
  redis:  
    image: redis:latest  
    container_name: redis-server  
    command: [  
      "redis-server",  
      "--requirepass", "redis"
    ]  
    ports:  
      - "6379:6379"  
    volumes:  
      - ./data:/data  
    networks:  
      - redis-network
    restart: always

volumes:  
  data:  

networks:  
  redis-network: