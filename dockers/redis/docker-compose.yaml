services:  
  redis:  
    image: redis:${REDIS_VERSION:-latest}  
    container_name: ${REDIS_CONTAINER_NAME:-redis-server}  
    command: [  
      "redis-server",  
      "--requirepass", "${REDIS_PASSWORD}"
    ]  
    ports:  
      - "${REDIS_PORT:-6379}:6379"  
    volumes:  
      - ./data:/data  
    networks:  
      - redis
    restart: always

networks:  
  redis: