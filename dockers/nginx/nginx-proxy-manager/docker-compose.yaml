name: nginx-proxy-manager

services:
  app:
    image: jlesage/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    ports:
      - "80:8080"
      - "443:4443"
      - "8100:8181"
    volumes:
      - ./config:/config
    networks:
      - gateway
    restart: unless-stopped

  docker-sync:
    profiles:
      - auto-sync
    build:
      context: ./docker-sync
    container_name: nginx-proxy-manager-docker-sync
    env_file:
      - path: .env
        format: raw
    environment:
      NPM_API_URL: http://app:8181/api
      GATEWAY_NETWORK: ${GATEWAY_NETWORK:-nginx_gateway}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gateway
    depends_on:
      - app
    restart: unless-stopped

networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-nginx_gateway}
