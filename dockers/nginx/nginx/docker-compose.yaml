name: gateways

services:
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./conf/generated:/etc/nginx/gateway.d:ro
      - ./tls:/etc/nginx/tls:ro
    networks:
      - gateway
    restart: always

networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-nginx_gateway}