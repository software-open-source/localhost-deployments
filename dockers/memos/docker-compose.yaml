name: localhost
# https://usememos.com/

services:
  memos:
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    ports:
      - "5230:5230"
    volumes:
      - ./data:/var/opt/memos
    environment:
      MEMOS_PORT: ${MEMOS_PORT:-5230}
      MEMOS_DRIVER: ${MEMOS_DRIVER:-sqlite}
      MEMOS_INSTANCE_URL: ${MEMOS_INSTANCE_URL:-http://localhost:5320}
      