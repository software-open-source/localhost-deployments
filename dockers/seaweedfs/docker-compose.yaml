services:
  master:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    ports:
      - "${MASTER_PORT:-9333}:9333"
    volumes:
      - ./data/master:/data
    command: "master -ip=master -mdir=/data"
    networks:
      - seaweedfs
    restart: always

  volume:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    ports:
      - "${VOLUME_PORT:-8081}:8081"
    volumes:
      - ./data/volume:/data
    command: "volume -mserver=master:9333 -port=8081 -dir=/data"
    depends_on:
      - master
    networks:
      - seaweedfs
    restart: always

  filer:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    ports:
      - "${FILER_PORT:-8888}:8888"
      - "${S3_PORT:-8333}:8333"
    volumes:
      - ./data/filer:/data
      - ./filer.toml:/etc/seaweedfs/filer.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo '{ "identities":[{"name": "admin", "credentials":[{"accessKey": "${S3_ACCESS_KEY}", "secretKey": "${S3_SECRET_KEY}"}], "actions":["Admin", "Read", "Write", "List", "Tagging"]}]}' > /tmp/s3.json
        weed filer -master="master:9333" -s3 -s3.config=/tmp/s3.json
    depends_on:
      - master
      - volume
    networks:
      - seaweedfs
    restart: always

networks:
  seaweedfs:
    driver: bridge
