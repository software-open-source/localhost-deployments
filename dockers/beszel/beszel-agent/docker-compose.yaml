name: localhost

services:
  beszel-agent:
    image: henrygd/beszel-agent-nvidia:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${AGENT_DATA_DIR}:/var/lib/beszel-agent
      - ${DOCKER_SOCKET}:/var/run/docker.sock:ro
    environment:
      LISTEN: ${LISTEN}
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}
      HUB_URL: ${HUB_URL}
      GPU_COLLECTOR: ${GPU_COLLECTOR}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - utility
