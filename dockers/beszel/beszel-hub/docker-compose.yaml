name: localhost

services:
  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    environment:
      - APP_URL=${APP_URL:-http://localhost:8090}
      - CONTAINER_DETAILS=${CONTAINER_DETAILS:-true}
    ports:
      - "${HUB_PORT:-8090}:8090"
    volumes:
      - ${HUB_DATA_DIR:-./data/beszel_data}:/beszel_data
