apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: vault-local
spec:
  type: NodePort
  selector:
    app: vault
  ports:
    - name: https
      port: 8200 # gọi trong cluster
      targetPort: 8200 # port container Vault
      nodePort: 30443 # NODE_PORT — install script sẽ thay số này theo .env
