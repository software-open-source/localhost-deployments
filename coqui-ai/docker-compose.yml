version: "3.9"

services:
  tts:
    image: ghcr.io/coqui-ai/tts-cpu:latest
    container_name: coqui-tts
    ports:
      - "5002:5002"
    entrypoint: [ "python3", "TTS/server/server.py" ]
    command: [ "--model_name", "${TTS_MODEL}" ]
    environment:
      - TTS_MODEL=tts_models/en/vctk/vits
    restart: unless-stopped
